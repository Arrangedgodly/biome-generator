<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1b2e" />
    <meta
      name="description"
      content="An interactive biome-map generator: hand-ported simplex noise, staged into terrain you can watch think — elevation, moisture, color."
    />
    <title>Procedural Biome Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!--
      DIRECTION CONTRACT · seed 3ee7b067 · code-led
      THESIS: A ground station receiving procedural terrain — the map is a
      false-color composite acquired in bands; every control is telemetry.
      Refuses the dark-dashboard-with-slider-sidebar by reading as one
      instrument: ruler ticks, registration marks, mono readouts, one amber
      signal for what is live.
      OWN-WORLD: night-navy ground, ice text, steel hairlines, single
      capture-amber; Archivo display + Martian Mono telemetry; the plate
      framed by coordinate rulers, the panel divided into labeled modules.
      STORY: the visitor watches bands acquire into a world, reads capture
      metadata, retunes the bands, locks a target pixel, exports or shares
      the exact capture, opens the source.
      FIRST VIEWPORT: mission strip (title + truth chips) above the raster
      plate left and the telemetry rack right; the amber Acquire stamp
      anchors the rack; pass-line + target readout close the plate below.
      FORM: earth-observation console; ranked 1 of 7 grounded candidates.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->
    <header id="app-header">
      <div class="mission-id">
        <h1>Procedural Biome Generator</h1>
        <p class="tagline">Simplex noise, staged into biomes — elevation, moisture, color.</p>
      </div>
      <div class="mission-meta">
        <p class="meta-line">
          <span class="meta-chip">Hand-ported simplex/fBm</span>
          <span class="meta-chip">512² field</span>
          <span class="meta-chip">Off-thread</span>
        </p>
        <!-- The portfolio visitor's quiet exit ramp: the evidence is the source. -->
        <p class="source-link-wrap">
          <a
            class="source-link"
            href="https://github.com/Arrangedgodly/biome-generator"
            target="_blank"
            rel="noopener noreferrer"
            >View the source on GitHub</a
          >
        </p>
      </div>
    </header>
    <main id="app">
      <!-- The raster plate: canvas + surveyor's probe (crosshair overlay,
           readout line, keyboard announcer). The probe interrogates the live
           fields — position, elevation, moisture, biome — without ever
           touching the canvas pixels (DOM overlay only, D2 no-readback intact).
           The frame's rulers and registration marks are the plate's own
           apparatus (aria-hidden): they describe the 512² raster it carries. -->
      <div id="stage">
        <figure class="plate">
          <div class="plate-ruler plate-ruler-top" aria-hidden="true">
            <span>0</span><span>128</span><span>256</span><span>384</span><span>512</span>
          </div>
          <div class="plate-ruler plate-ruler-left" aria-hidden="true">
            <span>0</span><span>128</span><span>256</span><span>384</span><span>512</span>
          </div>
          <div class="plate-ticks plate-ticks-top" aria-hidden="true"></div>
          <div class="plate-ticks plate-ticks-left" aria-hidden="true"></div>
          <i class="plate-mark plate-mark-tl" aria-hidden="true"></i>
          <i class="plate-mark plate-mark-tr" aria-hidden="true"></i>
          <i class="plate-mark plate-mark-bl" aria-hidden="true"></i>
          <i class="plate-mark plate-mark-br" aria-hidden="true"></i>
          <div class="plate-surface">
            <canvas
              id="map-canvas"
              width="512"
              height="512"
              tabindex="0"
              aria-label="Generated biome map — hover or use the arrow keys to probe terrain"
            ></canvas>
            <div id="probe-overlay" aria-hidden="true" hidden>
              <div class="probe-line probe-v"></div>
              <div class="probe-line probe-h"></div>
              <div class="probe-dot"></div>
            </div>
          </div>
        </figure>
        <!-- Caption block: map status (stage label, panel-driven) + probe
             reading — the plate's instruments report under the plate. -->
        <div id="stage-status"></div>
        <p id="probe-readout"></p>
        <!-- The map's key (onboard): one quiet line until opened; swatches are
             populated from the SAME BIOMES data the renderer classifies with. -->
        <details id="biome-legend" class="legend">
          <summary>Biome legend</summary>
          <div id="legend-swatches" class="legend-swatches"></div>
        </details>
        <p id="probe-announce" class="visually-hidden" aria-live="polite"></p>
      </div>
      <aside id="controls" aria-label="Map controls"></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
